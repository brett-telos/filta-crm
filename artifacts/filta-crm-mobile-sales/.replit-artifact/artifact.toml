kind = "mobile"
previewPath = "/mobile-sales/"
title = "Filta CRM Mobile Sales"
description = "Mobile sales companion for the Filta CRM, giving field and territory teams phone-friendly access to their pipeline, accounts, opportunities, and sales workflows."
version = "1.0.0"
id = "artifacts/filta-crm-mobile-sales"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile-sales/" ]
localPort = 22290

[services.development]
run = "pnpm --filter @workspace/filta-crm-mobile-sales run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/filta-crm-mobile-sales", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/filta-crm-mobile-sales", "run", "serve" ]

[services.env]
PORT = "22290"
BASE_PATH = "/mobile-sales/"
